  ko: NVD의 이 CVE들은 WireMock 프로젝트(github.com/wiremock/wiremock — Java HTTP 모킹 서버와 그 Python 클라이언트·Docker 이미지)의 취약점이다. GitHub 권고 GHSA-pmxq-pj47-j8j4도 maven·pypi 패키지만 기록한다. Rust 크레이트 wiremock(crates.io)은 이름만 같은 별개 프로젝트라 해당하지 않는다. NVD 항목이 대상 플랫폼을 지정하지 않아(target_sw *) 이름으로 잘못 걸린다.
  en: These NVD records describe the WireMock project (github.com/wiremock/wiremock — the Java HTTP mock server and its Python client and Docker images). GitHub advisory GHSA-pmxq-pj47-j8j4 lists only maven and pypi packages. The Rust crate wiremock on crates.io is an unrelated project that shares the name; the NVD criteria do not pin target_sw, so it matches by name.
